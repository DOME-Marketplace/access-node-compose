  seaweedfs:
    # Service: SeaweedFS S3 STORAGE
    # Purpose: S3-compatible object storage for the Access Node (attachments of
    #          tm-forum-api-document-management, bucket "document-attachments").
    # Ports: 8333 (S3 API), 12535 (admin web UI), both published on 127.0.0.1 only.
    # Credentials: .env.s3 (S3 keys for document-management, admin UI login).
    # No Kubernetes equivalent in gitops: version pinned statically here, not provided by the versions API.
    image: chrislusf/seaweedfs:4.53
    container_name: seaweedfs
    restart: always
    # The S3 identity is written to a config file at startup from .env.s3: unlike the
    # AWS_ACCESS_KEY_ID fallback, it can't be overridden by users created later in the
    # admin UI. Without any credentials SeaweedFS would accept every key.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for key in "$${S3_ACCESS_KEY:-}" "$${S3_SECRET_KEY:-}"; do
          case "$$key" in
            ""|*[!A-Za-z0-9._-]*)
              echo "S3_ACCESS_KEY and S3_SECRET_KEY in .env.s3 must be set and use only letters, digits, '.', '_' or '-'." >&2
              exit 1 ;;
          esac
        done
        printf '{"identities":[{"name":"document-management","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}\n' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3-config.json
        exec weed mini -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -s3.config=/tmp/s3-config.json -bucket=document-attachments -admin.user="$${SEAWEEDFS_ADMIN_USER:-admin}" -admin.password="$${SEAWEEDFS_ADMIN_PASSWORD:-}" -webdav=false -s3.port.iceberg=0 -s3.port.lance=0 -master.telemetry=false
    env_file:
      - .env.s3
    ports:
      - "127.0.0.1:8333:8333"     # S3 API
      - "127.0.0.1:12535:12535"   # Admin web UI
    volumes:
      - seaweedfs-data:/data
    labels:
      - "dome.name=seaweedfs"
      - "dome.description=S3-compatible object storage for the Access Node"
      - "dome.owner=Altia"
      - "dome.type=service"
      - "dome.lifecycle=sandbox"
      - "dome.versions=any"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - access-node




  # --- CORE & DLT ---
  # These services handle data replication and DLT synchronization.

  desmos:
    # Service: DESMOS
    # Purpose: Manages replication of data across nodes in the DOME ecosystem.
    # Internal Ports: 8080 (API)
    image: __CONTAINER_IMAGE_PLACEHOLDER__
    container_name: desmos
    restart: always
    depends_on:
      - postgres
      - scorpio
      - dlt-adapter-alastria
    labels:
      - "dome.name=desmos"
      - "dome.description=Manages replication of data across nodes"
      - "dome.owner=Altia"
      - "dome.type=service"
      - "dome.lifecycle=sandbox"
      - "dome.dependsOn=component:postgres,component:scorpio,component:dlt-adapter-alastria"
      - "dome.versions=postgres:any,scorpio:any,dlt-adapter-alastria:any"
    # ports:
    #   - "8080:8080"
    environment:
      # Application Configuration
      API_VERSION: v2
      SERVER_PORT: 8080

      # Logging Configuration
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ES_IN2_DESMOS: INFO
      
      # Database Configuration
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: desmos
      DB_HOST: postgres
      DB_PORT: 5432
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/desmos
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/desmos
      
      # Context Broker Configuration
      BROKER_PROVIDER: scorpio
      BROKER_EXTERNAL_DOMAIN: http://scorpio:9090
      BROKER_INTERNAL_DOMAIN: http://scorpio:9090
      
      # DLT Adapter Configuration
      DLT_ADAPTER_PROVIDER: digitelts
      DLT_ADAPTER_INTERNAL_DOMAIN: http://dlt-adapter-alastria:8080
      DLT_ADAPTER_EXTERNAL_DOMAIN: http://dlt-adapter-alastria:8080
    env_file:
      - .env.desmos
      - .secrets.desmos
    networks:
      - access-node
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 60s


  dlt-adapter-alastria:
    # Service: DLT Adapter Alastria
    # Purpose: Interface for Alastria DLT.
    # Internal Ports: 8080 (API)
    image: __CONTAINER_IMAGE_PLACEHOLDER__
    container_name: dlt-adapter-alastria
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "dome.name=dlt-adapter-alastria"
      - "dome.description=Interface for Alastria DLT"
      - "dome.owner=DigitelTS"
      - "dome.type=service"
      - "dome.lifecycle=sandbox"
      - "dome.dependsOn="
      - "dome.versions="
    # ports:
    #   - "8080:8080"
    env_file:
      - .env.dlt-adapter-alastria
    networks:
      - access-node


  scorpio:
    # Service: Scorpio Broker
    # Purpose: Context Broker for NGSI-LD data.
    # Internal Ports: 9090
    image: __CONTAINER_IMAGE_PLACEHOLDER__
    container_name: scorpio
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx2g -XX:+ExitOnOutOfMemoryError"
    mem_limit: 3g
    restart: unless-stopped
    # Readiness includes the PostgreSQL connection. Long start period: the first
    # start after a Scorpio upgrade can spend minutes on database migrations.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9090/q/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    depends_on:
      - postgres
    labels:
      - "dome.name=scorpio"
      - "dome.description=NGSI-LD Context Broker"
      - "dome.owner=Elliot"
      - "dome.type=service"
      - "dome.lifecycle=sandbox"
      - "dome.dependsOn=component:postgres"
      - "dome.versions=postgres:any"
    ports:
      - "9090:9090"
    env_file:
      - .env.scorpio
    networks:
      - access-node

  postgres:
    # Service: PostgreSQL Database
    # No Kubernetes equivalent in gitops: version pinned statically here, not provided by the versions API.
    image: postgis/postgis:15-3.4
    container_name: postgres
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "dome.name=postgres"
      - "dome.description=PostgreSQL with PostGIS extension"
      - "dome.owner=Elliot"
      - "dome.type=database"
      - "dome.lifecycle=sandbox"
      - "dome.versions=any"
    env_file:
      - .env.postgres
    volumes:
      - ${POSTGRES_DATA_PATH:-pgdata}:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - access-node

  # --- API Gateway & Entry Point ---
  # This service is the SINGLE ENTRY POINT to the entire Access Node stack.
  # All external traffic MUST pass through this proxy.

  caddy:
    # Service: Caddy API Gateway
    # Purpose: Single entry point for all external traffic entering Access Node.
    # Ports: 80 (HTTP exposed), 443 (HTTPS)
    # No Kubernetes equivalent in gitops: version pinned statically here, not provided by the versions API.
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    # Caddy's admin API may be disabled in the Caddyfile: just check that HTTPS is listening.
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      #- "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    labels:
      - "dome.name=caddy"
      - "dome.description=API Gateway and Reverse Proxy for Access Node"
      - "dome.owner=Altia"
      - "dome.type=proxy"
      - "dome.lifecycle=sandbox"
      - "dome.dependsOn=component:tm-forum-api-account,component:tm-forum-api-agreement,component:tm-forum-api-customer-bill-management,component:tm-forum-api-customer-management,component:tm-forum-api-party-catalog,component:tm-forum-api-party-role,component:tm-forum-api-product-catalog,component:tm-forum-api-product-inventory,component:tm-forum-api-product-ordering-management,component:tm-forum-api-quote,component:tm-forum-api-resource-catalog,component:tm-forum-api-resource-function-activation,component:tm-forum-api-resource-inventory,component:tm-forum-api-service-catalog,component:tm-forum-api-service-inventory,component:tm-forum-api-usage-management,component:desmos"
      - "dome.versions=any"
    networks:
      - access-node

  dozzle:
    # Service: Dozzle - Realtime log viewer for Docker containers
    # Purpose: Provides a web interface to view logs of all running containers in real-time.
    # Internal Ports: 8080 (Web UI)
    # Redirected to https://<host>/dozzle via Caddy reverse proxy.
    # Note: Dozzle is disabled by default and can be enabled via Docker Compose profiles, or by running the stack with `docker compose --profile debug up -d`.
    #       If you want to enable Dozzle by default, remove or comment the `profiles` directive below, or run the stack with `docker compose --profile debug up -d`.
    container_name: dozzle
    # No Kubernetes equivalent in gitops: version pinned statically here, not provided by the versions API.
    image: amir20/dozzle:latest
    environment:
      - DOZZLE_BASE=/dozzle
    ports:
      - "8888:8080"
    restart: always
    # The image has no shell: Dozzle ships its own healthcheck command.
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - access-node
    labels:
      - "dome.name=dozzle"
      - "dome.description=Realtime log viewer for Docker containers"
      - "dome.owner=Altia"
      - "dome.type=service"
      - "dome.lifecycle=sandbox"
      - "dome.versions=any"
    # Comment the profile directive to have dozzle always enabled.
    # if profile is active (dozzle disabled by default), you can still manually enable dozzle with the command: docker compose --profile debug up -d
    profiles:
      - debug



networks:
  access-node:
    name: access-node

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  seaweedfs-data:

