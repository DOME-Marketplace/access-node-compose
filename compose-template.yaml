  tm-forum-api-account:
    # Service: TMF666 - Account Management
    # Purpose: Manages user accounts and profiles.
    # Internal Ports: 8080 (API), 9090 (Admin/Metrics)
    image: __CONTAINER_IMAGE_PLACEHOLDER__
    container_name: TMF666_account
    restart: always
    healthcheck: *tmf-healthcheck
    labels:
      - "dome.name=tm-forum-api-account"
      - "dome.description=Manages user accounts and profiles"
      - "dome.owner=Libelium"
      - "dome.type=service"
      - "dome.lifecycle=sandbox"
      - "dome.dependsOn=component:scorpio"
      - "dome.versions="
    # ports:
    #   - "8080:8080"
    #   - "9090:9090"
    env_file:
      - .env.tmforum-common
    networks:
      - access-node

