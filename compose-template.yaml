# Shared healthcheck of the TMForum API services: Micronaut management endpoint.
# Long start period: on a full stack restart they wait for Scorpio and may take
# a few minutes to open the port (a service turns healthy as soon as it answers).
x-tmf-healthcheck: &tmf-healthcheck
  test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9090/health"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 300s

services:

